services:
    app:
        image: ${APP_IMAGE}
        build:
            context: ${APP_BUILD_CONTEXT}
            dockerfile: ${APP_DOCKERFILE}
        depends_on:
            postgres:
                condition: ${POSTGRES_DEPENDS_ON_CONDITION}
        environment:
            NODE_ENV: ${NODE_ENV}
            DB: ${DB}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_NAME: ${DB_NAME}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
            PORT: ${APP_CONTAINER_PORT}
            VENDURE_COOKIE_SECRET: ${VENDURE_COOKIE_SECRET}
            SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
            SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
            VENDURE_STOREFRONT_URL: ${VENDURE_STOREFRONT_URL}
            VENDURE_CORS_ORIGINS: ${VENDURE_CORS_ORIGINS}
            VENDURE_TRUST_PROXY: ${VENDURE_TRUST_PROXY}
            VENDURE_ASSET_UPLOAD_DIR: ${VENDURE_ASSET_UPLOAD_DIR}
            VENDURE_ASSET_URL_PREFIX: ${VENDURE_ASSET_URL_PREFIX}
            VENDURE_SERVE_STATIC_DASHBOARD: ${VENDURE_SERVE_STATIC_DASHBOARD}
            VENDURE_SERVE_GRAPHIQL: ${VENDURE_SERVE_GRAPHIQL}
            VENDURE_SERVE_SWAGGER: ${VENDURE_SERVE_SWAGGER}
            VENDURE_VERIFY_EMAIL_URL: ${VENDURE_VERIFY_EMAIL_URL}
            VENDURE_PASSWORD_RESET_URL: ${VENDURE_PASSWORD_RESET_URL}
            VENDURE_CHANGE_EMAIL_URL: ${VENDURE_CHANGE_EMAIL_URL}
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_SECURE: ${SMTP_SECURE}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASSWORD: ${SMTP_PASSWORD}
            EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
            STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
            S3_BUCKET: ${S3_BUCKET}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
            S3_REGION: ${S3_REGION}
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
        ports:
            - '${APP_HOST_PORT}:${APP_CONTAINER_PORT}'
        volumes:
            - vendure_assets:${VENDURE_ASSET_UPLOAD_DIR}

    postgres:
        image: ${POSTGRES_IMAGE}
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: ${POSTGRES_HEALTHCHECK_INTERVAL}
            timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT}
            retries: ${POSTGRES_HEALTHCHECK_RETRIES}
        volumes:
            - postgres_data:${POSTGRES_DATA_PATH}

volumes:
    postgres_data:
        name: ${POSTGRES_VOLUME_NAME}
    vendure_assets:
        name: ${ASSET_VOLUME_NAME}
